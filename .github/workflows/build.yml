# build does not work on Java 9 or later as Java 5 is not a valid target

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 8
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-8-arm64
    permissions:
      security-events: write  # for github/codeql-action
      contents: read
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  #v4.2.2

    - name: Set up JDK
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12  #v4.7.0
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        # No vendor ships a native Windows ARM64 JDK 8, so this leg installs the x64 JDK 8
        # and runs it on windows-11-arm through the built-in x64 emulation. Every other leg
        # leaves this empty, which keeps the runner's native architecture.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 8) && 'x64' || '' }}
        cache: 'maven'

    - name: Maven version
      run: |
        mkdir -p ./.mvn
        echo "-e" >> ./.mvn/maven.config
        echo "-B" >> ./.mvn/maven.config
        echo "-ntp" >> ./.mvn/maven.config
        echo "-DtrimStackTrace=false" >> ./.mvn/maven.config
        echo "--settings" >> ./.mvn/maven.config
        echo "$( pwd )/.github/maven-settings.xml" >> ./.mvn/maven.config
        mvn --version
        mkdir -p target

    #------------------------------------------------------------------------
    # The CodeQL CLI does not support win32/arm64 (its build tracer cannot inject on
    # windows-11-arm), so only the CodeQL analysis is left out on that runner. The Maven
    # build and the full test suite below still run on every leg.
    - name: Initialize CodeQL
      if: ${{ !(matrix.os == 'windows-latest' && matrix.arch == 'arm64') }}
      uses: github/codeql-action/init@v4  # v4 selects the CodeQL bundle matching the runner arch (linux-arm64 supported)
      with:
        languages: java

    - name: Maven build
      run: |
        mvn install site

    - name: Perform CodeQL Analysis
      if: ${{ !(matrix.os == 'windows-latest' && matrix.arch == 'arm64') }}
      uses: github/codeql-action/analyze@v4
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
